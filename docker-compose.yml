services:
  postgres:
    image: postgres:17
    container_name: billiardiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billiardIQ
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billiardIQ"]
      interval: 5s
      timeout: 5s
      retries: 10

  zeymera.billiardiq.webapp:
    image: ${DOCKER_REGISTRY-}zeymerabilliardiqwebapp
    build:
      context: Scoreboard.WebApp
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - webapp-players:/app/wwwroot/Players

  # The table scoreboard (kiosk). It pulls clubs/teams/players from the panel and pushes finished match results back,
  # identifying itself with the venue's client id (X-Client-Id) and its scoreboard number (X-Table-No) only.
  # Sync with the panel is optional: the two apps do not depend on each other and only share data when it is configured.
  # Configure it in Scoreboard.Client/appsettings.json (RemoteSync: Enabled, ClientId, TableNo, PollSeconds); the client id is
  # shown on the panel's "Bağlantı" page, the table number is the scoreboard number listed there. Only the panel's address
  # is set here, because inside Docker the panel is reached by its container name.
  zeymera.billiardiq.scoreboard.client:
    image: ${DOCKER_REGISTRY-}zeymerabilliardiqscoreboardclient
    build:
      context: .
      dockerfile: Scoreboard.Client/Dockerfile
    # No restart policy here on purpose: Visual Studio stops and restarts this container while it attaches the debugger.
    # Add `restart: unless-stopped` in a production compose file.
    # No depends_on here (the debug override only orders the start): the client serves its own UI and keeps its own SQLite data, so it starts and runs even when the
    # panel is down. The panel is only contacted in the background to pull clubs/teams/players and push match results.
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      RemoteSync__BaseUrl: http://zeymera.billiardiq.webapp:8080/api/
    ports:
      - "5288:8080"
    volumes:
      - scoreboard-db:/app/wwwroot/Db
      - scoreboard-photos:/app/wwwroot/PlayerSet
      - scoreboard-logs:/app/logs

volumes:
  postgres-data:
  webapp-players:
  scoreboard-db:
  scoreboard-photos:
  scoreboard-logs:
